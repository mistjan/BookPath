// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle:8.13.0')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

subprojects {
    plugins.withId("com.facebook.react") {
        react {
            def rootNodeModules = rootProject.file("../../../node_modules").absoluteFile
            def rnDir = new File(rootNodeModules, "react-native")
            reactNativeDir.set(rnDir)

            def codegenDirFile = new File(rootNodeModules, "@react-native/codegen")
            if (!codegenDirFile.exists()) {
                codegenDirFile = new File(rnDir, "node_modules/@react-native/codegen")
            }
            if (codegenDirFile.exists()) {
                codegenDir.set(codegenDirFile)
            }
        }
    }
}




